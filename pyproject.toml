[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heart-of-the-swarm"
version = "0.2.0"
description = "A portable runtime that designs, validates, builds, and runs task-specific agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "langchain>=1.0,<2",
  "langchain-openai>=0.3,<2",
  "mlflow-tracing>=3.5,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
mlflow-server = [
  "mlflow>=3.5,<4",
  "psycopg2-binary>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heart_of_the_swarm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
